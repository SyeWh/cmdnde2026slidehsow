<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projection NDE</title>
<style>
  :root { --bg:#0f0f12; --card:#1b1b20; --line:#2c2c33; --text:#e8e8ec; --muted:#8a8a95; --accent:#c8102e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  header { position:sticky; top:0; z-index:5; display:flex; gap:10px; align-items:center; padding:14px 24px; background:rgba(15,15,18,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; font-weight:600; margin:0 auto 0 0; }
  button { font:inherit; color:var(--text); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; }
  button:hover { border-color:#555; }
  button.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .hint { color:var(--muted); font-size:12px; padding:10px 24px 0; }

  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:22px 18px; padding:20px 24px 60px; }
  .card { position:relative; cursor:grab; }
  .card.dragging { opacity:.35; }
  .card.over .thumb { outline:2px solid var(--accent); outline-offset:3px; }
  .thumb { position:relative; aspect-ratio:16/9; border-radius:6px; overflow:hidden; background:#000; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .thumb .del { position:absolute; top:6px; right:6px; padding:0 7px; font-size:13px; line-height:20px; border-radius:50%; background:rgba(0,0,0,.6); border:none; opacity:0; }
  .card:hover .del { opacity:1; }
  .meta { display:flex; align-items:center; gap:6px; margin-top:6px; }
  .num { color:var(--muted); font-size:12px; min-width:18px; }
  .title { flex:1; min-width:0; font:inherit; font-size:13px; color:var(--text); background:transparent; border:1px solid transparent; border-radius:4px; padding:2px 4px; }
  .title:hover, .title:focus { border-color:var(--line); outline:none; background:var(--card); }
  .tbtn { padding:1px 6px; font-size:12px; border-radius:5px; color:var(--muted); }
  .tbtn.on { color:#fff; background:var(--accent); border-color:var(--accent); }

  /* Diaporama */
  #show { position:fixed; inset:0; background:#000; display:none; align-items:center; justify-content:center; z-index:10; cursor:none; }
  #show.open { display:flex; }
  #show.mouse { cursor:default; }
  .stage { position:relative; width:min(100vw, 177.78vh); aspect-ratio:16/9; container-type:inline-size; }
  .stage img { width:100%; height:100%; object-fit:contain; display:block; }
  #timer { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  #timer.on { display:flex; }
  #clock { font-family:Didot, "Bodoni 72", Georgia, serif; font-size:17cqw; font-variant-numeric:tabular-nums; color:#f2ece4; text-shadow:0 0 2cqw rgba(0,0,0,.6); letter-spacing:.02em; }
  #clock.done { animation:blink 1s steps(2) infinite; color:#fff; }
  @keyframes blink { 50% { opacity:.15; } }
  #startBtn { position:absolute; left:50%; top:76%; transform:translateX(-50%); font-family:Didot, Georgia, serif; font-size:1.6cqw; letter-spacing:.2em; text-transform:uppercase; padding:.8cqw 2.4cqw; color:#f2ece4; background:rgba(0,0,0,.35); border:1px solid rgba(242,236,228,.6); border-radius:0; cursor:pointer; }
  #startBtn:hover { background:rgba(0,0,0,.55); }
  #show:not(.mouse) #startBtn.running { opacity:0; }
  .nav, .mv { display:none; }

  /* Phone only (portrait by width, landscape by height). Desktop is unaffected. */
  @media (max-width: 600px), (pointer: coarse) and (max-height: 500px) {
    header { flex-wrap:wrap; padding:12px 16px; }
    header h1 { width:100%; }
    header button { flex:1; padding:10px 8px; font-size:13px; }
    #playBtn { flex-basis:100%; order:3; }
    .hint { padding:10px 16px 0; }
    #grid { grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:18px 12px; padding:16px 16px 60px; }
    .meta { flex-wrap:wrap; }
    .title { order:-1; flex-basis:100%; }
    .num { flex:1; }
    .thumb .del { opacity:1; font-size:16px; line-height:26px; padding:0 9px; }
    .mv, .tbtn { display:inline-block; padding:5px 9px; font-size:14px; }
    #show { cursor:default; }
    #startBtn { font-size:10px; padding:5px 12px; }
    #show:not(.mouse) #startBtn.running { opacity:1; }
    .nav { display:flex; position:fixed; bottom:max(16px, env(safe-area-inset-bottom)); left:16px; right:16px; gap:8px; align-items:center; }
    .nav button { padding:12px 16px; font-size:16px; background:rgba(30,30,35,.85); }
    .nav span { flex:1; min-width:0; color:#aaa; font-size:12px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  }
</style>
</head>
<body>

<header>
  <h1>Projection NDE</h1>
  <button id="addBtn">+ Ajouter des images</button>
  <button id="resetBtn">Réinitialiser l'ordre</button>
  <button class="primary" id="playBtn">▶ Lancer le diaporama</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
</header>
<div class="hint">Glissez les images pour changer l'ordre · cliquez sur un titre pour le renommer · ⏱ = écran chrono 4:00 après cette diapo · double‑clic sur une image pour lancer depuis celle‑ci</div>
<div id="grid"></div>

<div id="show">
  <div class="stage">
    <img id="slideImg" alt="">
    <div id="timer">
      <div id="clock">4:00</div>
      <button id="startBtn">Démarrer</button>
    </div>
  </div>
  <div class="nav">
    <button id="prevBtn">←</button>
    <span id="counter"></span>
    <button id="nextBtn">→</button>
    <button id="exitBtn">✕</button>
  </div>
</div>

<script>
const TIMER_IMAGE = "TIMER.webp";
const TIMER_SECONDS = 4 * 60;
const STORE_KEY = "projection-nde-v3";

// Default order. Files whose name starts with "participant" get the timer screen after them.
const DEFAULT_FILES = [
  "AFFICHE HORIZONTAL.png",
  "MOT DIRECTEUR.jpg", "MOT P SBS.jpg", "MOT P CMD.jpg", "MOT DES CPS.jpg",
  "jurys CAMELIA.jpg", "jurys LAHCINI.jpg", "jurys chahrazad.jpg", "jurys kenza.jpg",
  "participant CIAD.jpg", "participant ASES.jpg", "participant ESPRESS.jpg", "participant ENACTUS.jpg",
  "participant GENIE.jpg", "participant EPIK.jpg", "participant GREEN INVEST.jpg", "participant AFSAM.jpg",
  "participant L'ADAM.jpg",
  "PASSAGE MUSICALE.jpg",
  "PAUSE.jpg",
  "participant C2P.jpg", "participant 6DAYS.jpg", "participant CMD.jpg", "participant LIONS.jpg",
  "participant elite.jpg", "participant TIZI.jpg", "participant ROTA.jpg", "participant ARTEMIS.jpg",
  "participant FINANCE CLUB.jpg",
  "PASSAGE VIOLON.jpg",
  "REMISE TROPHEE.jpg",
];

const makeItem = file => ({
  file,
  title: file.replace(/\.[^.]+$/, ""),
  timer: /^participant/i.test(file),
});

let items = load() || DEFAULT_FILES.map(makeItem);

function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); return Array.isArray(s) ? s : null; }
  catch { return null; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(items)); } catch {}
}

// ---------- Grid ----------
const grid = document.getElementById("grid");
let dragIndex = null;

function render() {
  grid.innerHTML = "";
  items.forEach((it, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.innerHTML = `
      <div class="thumb"><img loading="lazy" alt=""><button class="del" title="Retirer">×</button></div>
      <div class="meta">
        <span class="num">${i + 1}</span>
        <input class="title" spellcheck="false">
        <button class="mv" data-d="-1" title="Avancer">‹</button>
        <button class="mv" data-d="1" title="Reculer">›</button>
        <button class="tbtn ${it.timer ? "on" : ""}" title="Écran chrono après cette diapo">⏱</button>
      </div>`;
    card.querySelector("img").src = encodeURI(it.file).replace(/#/g, "%23");
    const title = card.querySelector(".title");
    title.value = it.title;
    title.addEventListener("input", () => { it.title = title.value; save(); });
    title.addEventListener("mousedown", e => e.stopPropagation());
    // Move buttons (phone only, since drag and drop doesn't work on touch screens).
    card.querySelectorAll(".mv").forEach(b => b.onclick = () => {
      const j = i + Number(b.dataset.d);
      if (j < 0 || j >= items.length) return;
      [items[i], items[j]] = [items[j], items[i]];
      save(); render();
    });
    card.querySelector(".tbtn").onclick =() => { it.timer = !it.timer; save(); render(); };
    card.querySelector(".del").onclick = () => {
      if (confirm(`Retirer « ${it.title} » du diaporama ?`)) { items.splice(i, 1); save(); render(); }
    };
    card.querySelector(".thumb").ondblclick = () => openShow(slideIndexForItem(i));

    card.addEventListener("dragstart", e => { dragIndex = i; card.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    card.addEventListener("dragend", () => { card.classList.remove("dragging"); dragIndex = null; });
    card.addEventListener("dragover", e => { e.preventDefault(); card.classList.add("over"); });
    card.addEventListener("dragleave", () => card.classList.remove("over"));
    card.addEventListener("drop", e => {
      e.preventDefault();
      card.classList.remove("over");
      if (dragIndex === null || dragIndex === i) return;
      const [moved] = items.splice(dragIndex, 1);
      items.splice(i, 0, moved);
      save(); render();
    });
    grid.appendChild(card);
  });
}

// Images must sit in the same folder as this page; we just keep their file names.
document.getElementById("addBtn").onclick = () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = e => {
  for (const f of e.target.files) items.push(makeItem(f.name));
  e.target.value = "";
  save(); render();
};
document.getElementById("resetBtn").onclick = () => {
  if (!confirm("Revenir à l'ordre et aux titres par défaut ?")) return;
  items = DEFAULT_FILES.map(makeItem); save(); render();
};

// ---------- Diaporama ----------
const show = document.getElementById("show");
const slideImg = document.getElementById("slideImg");
const timerBox = document.getElementById("timer");
const clock = document.getElementById("clock");
const startBtn = document.getElementById("startBtn");
const counter = document.getElementById("counter");
let slides = [], cur = 0;

function buildSlides() {
  slides = [];
  items.forEach(it => {
    slides.push({ src: it.file, title: it.title });
    if (it.timer) slides.push({ src: TIMER_IMAGE, title: "Chrono — " + it.title, timer: true });
  });
}
function slideIndexForItem(i) {
  buildSlides();
  return items.slice(0, i).reduce((n, it) => n + 1 + (it.timer ? 1 : 0), 0);
}

function openShow(start = 0) {
  buildSlides();
  if (!slides.length) return;
  show.classList.add("open");
  document.documentElement.requestFullscreen?.().catch(() => {});
  go(start);
}
function closeShow() {
  stopTimer();
  show.classList.remove("open");
  if (document.fullscreenElement) document.exitFullscreen();
}
function go(n) {
  cur = Math.max(0, Math.min(slides.length - 1, n));
  const s = slides[cur];
  slideImg.src = encodeURI(s.src).replace(/#/g, "%23");
  counter.textContent = `${cur + 1} / ${slides.length} · ${s.title}`;
  resetTimer();
  timerBox.classList.toggle("on", !!s.timer);
  // Preload the next image so transitions are instant.
  if (slides[cur + 1]) new Image().src = encodeURI(slides[cur + 1].src).replace(/#/g, "%23");
}

// ---------- Timer ----------
let remaining = TIMER_SECONDS, tick = null, endAt = 0;

function fmt(sec) { return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
function paint() {
  clock.textContent = fmt(remaining);
  clock.classList.toggle("done", remaining === 0);
}
let audioCtx;
function beep() {
  audioCtx = audioCtx || new AudioContext();
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.frequency.value = 880;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.4);
}
function stopTimer() { clearInterval(tick); tick = null; startBtn.classList.remove("running"); }
function resetTimer() { stopTimer(); remaining = TIMER_SECONDS; startBtn.textContent = "Démarrer"; paint(); }
function toggleTimer() {
  if (remaining === 0) { resetTimer(); return; }
  if (tick) { stopTimer(); startBtn.textContent = "Reprendre"; return; }
  audioCtx = audioCtx || new AudioContext(); // created on the click so the browser allows sound later
  endAt = Date.now() + remaining * 1000;
  startBtn.textContent = "Pause";
  startBtn.classList.add("running");
  tick = setInterval(() => {
    const prev = remaining;
    remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    if (prev > 60 && remaining <= 60) beep();
    paint();
    if (remaining === 0) { stopTimer(); startBtn.textContent = "Réinitialiser"; }
  }, 200);
}
startBtn.onclick = e => { e.stopPropagation(); startBtn.blur(); toggleTimer(); };

// ---------- Controls ----------
document.getElementById("playBtn").onclick = () => openShow(0);
document.getElementById("prevBtn").onclick = () => go(cur - 1);
document.getElementById("nextBtn").onclick = () => go(cur + 1);
document.getElementById("exitBtn").onclick = closeShow;

document.addEventListener("keydown", e => {
  if (!show.classList.contains("open")) return;
  if (["ArrowRight", "PageDown", "ArrowDown"].includes(e.key)) go(cur + 1);
  else if (["ArrowLeft", "PageUp", "ArrowUp"].includes(e.key)) go(cur - 1);
  else if (e.key === "Escape") closeShow();
  else if ((e.key === " " || e.key === "Enter") && slides[cur].timer) { e.preventDefault(); toggleTimer(); }
  else if (e.key.toLowerCase() === "r" && slides[cur].timer) resetTimer();
  else return;
  e.preventDefault();
});
document.addEventListener("fullscreenchange", () => {
  if (!document.fullscreenElement && show.classList.contains("open")) { stopTimer(); show.classList.remove("open"); }
});

// Show the cursor and nav bar only while the mouse moves.
let hideT;
show.addEventListener("mousemove", () => {
  show.classList.add("mouse");
  clearTimeout(hideT);
  hideT = setTimeout(() => show.classList.remove("mouse"), 2000);
});

render();
</script>
</body>
</html>
